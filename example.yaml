# Example device config. Copy into ESPHome Device Builder, fill secrets.yaml.
substitutions:
  name: exhaust-fan
  friendly_name: Exhaust fan
  # Override pins etc. here if your wiring differs:
  # pwm_pin: GPIO25

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev        # ESP32 DevKit V1, 30-pin (ESP32-WROOM-32)
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret exhaust_fan_api_key

ota:
  - platform: esphome
    password: !secret exhaust_fan_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret exhaust_fan_ap_password

captive_portal:

packages:
  exhaust_fan: github://FilipWyka/exhaust-fan-esphome/exhaust-fan.yaml@v1.0.0
