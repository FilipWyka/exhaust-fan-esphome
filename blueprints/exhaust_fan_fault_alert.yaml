blueprint:
  name: Exhaust fan – fault alert
  description: Runs your actions (e.g. a phone notification) when the exhaust fan controller reports a fault (stalled fan or RPM mismatch) for a while.
  domain: automation
  source_url: https://github.com/FilipWyka/exhaust-fan-esphome/blob/main/blueprints/exhaust_fan_fault_alert.yaml
  input:
    fault_sensor:
      name: Fan fault sensor
      description: binary_sensor.<device>_fan_fault from the ESPHome controller
      selector:
        entity:
          domain: binary_sensor
    fault_for:
      name: Fault duration before alert
      default: 30
      selector:
        number: {min: 5, max: 600, step: 5, unit_of_measurement: s}
    alert_actions:
      name: Actions
      selector:
        action: {}

mode: single

triggers:
  - trigger: state
    entity_id: !input fault_sensor
    to: "on"
    for:
      seconds: !input fault_for

actions: !input alert_actions
